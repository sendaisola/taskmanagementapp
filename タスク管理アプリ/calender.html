<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calender.css">
    <title>calender</title>
</head>
<body>
    <div class="top-bar">
        <div class="calender-button">カレンダー</div>
        <div class="list-button">リスト</div>
        <script>
            document.querySelector('.list-button').onclick = function() {
            window.location.href = 'list.html';
            };
        </script>
        <button class="prevMonth" id="prevMonth" aria-label="前の月">＜</button>
        <div id="month"></div>
        <button id="nextMonth" aria-label="次の月">＞</button>
    </div>
    <div class="weekdays">
        <div class="sun">日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div class="sat">土</div>
    </div>

    <div class="calender" id="date"></div>
    <div class="screen-list">
        <div class="button-class">授業 </div>
        <script>
            document.querySelector('.button-class').onclick = function() {
            window.location.href = 'class.html';
            };
        </script>
        <div class="select-button">カレンダー</div>
        <div class="button-record">記録</div>
        <script>
            document.querySelector('.button-record').onclick = function() {
            window.location.href = 'record.html';
            };
        </script>
    </div>
    <script src="calender.js"></script>
</body>
</html>
