<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=divice-width,initial-scale=1">
        <title>自己紹介ページ</title>
        <link rel="stylesheet" href="./style/time.css">
    </head>

    <body>
        <div class="wrapper">
            <div class="header">
                <div class="header-inner">
                    <h2 class="back">
                        <a href="">＜戻る</a>
                        <!--授業一覧につなげる-->
                    </h2>
                    <div class="header-nav">
                        <h2 class="nav">
                            タイマー
                        </h2>
                    </div>
                    
                </div>

            </div>

            <div class="archives" id="archives">
                
                <div class="section-titletime">
                    <div class="time-display-container">
                        <div class="time-group">
                            <div class="rouded-box"></div>
                            <span class="label">時間</span>
                        </div>
                        <div class="time-group">
                            <div class="rouded-box"></div>
                            <span class="label">分</span>
                        </div>
                        <div class="time-group">
                            <div class="rouded-box"></div>
                            <span class="label">秒</span>
                        </div>
                    </div>
                </div>
                

                <h4 class="section-titlename">
                    授業名
                    <hr class="black-line">
                </h4>

                <h4 class="section-titlecolor">
                    課題名
                    <hr class="black-line">
                </h4>
               
                <h2 class="block">
                    <a class="block-1" href="">Start</a><!--登録ボタン-->
                </h2>

            </div>
                       
        </div>
    </body>
</html>
